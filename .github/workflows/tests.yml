name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[test,figures]'
      - name: Verify v0.3.3 freeze
        run: python experiments/freeze.py --verify
      - name: Run tests
        run: pytest -q

  diagrams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Render every diagram
        run: bash docs/diagrams/render.sh
